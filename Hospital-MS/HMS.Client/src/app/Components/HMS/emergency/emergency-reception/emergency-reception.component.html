<main id="emergency-reception" @fadeIn>
  <div class="container-fluid">
    <app-breadcrumb [TitleList]="TitleList"></app-breadcrumb>
    <form
      [formGroup]="emergencyForm"
      class="form p-2"
      (ngSubmit)="submitForm()"
    >
      <p-toast position="top-left"></p-toast>
      <h4>🏥بيانات الاستقبال</h4>
      <div class="row">
        <div class="col-lg-3 mb-3">
          <div class="mt-3">
            <label for="name" class="form-label"
              >إسم المريض<span class="text-danger">*</span></label
            >
            <input
              id="name"
              formControlName="patientName"
              placeholder="أدخل إسم المريض"
              class="form-control shadow-none"
            />
            <div
              *ngIf="
                emergencyForm.get('patientName')?.invalid &&
                emergencyForm.get('patientName')?.touched
              "
              class="text-danger"
            >
              اسم المريض مطلوب
            </div>
          </div>
        </div>
        <div class="col-lg-3 mb-3">
          <div class="mt-3">
            <label for="name" class="form-label"
              >النوع<span class="text-danger">*</span></label
            >
            <!-- <input id="name" formControlName="gender" placeholder="أدخل إسم المريض" class="form-control shadow-none" /> -->
            <select
              id="name"
              formControlName="gender"
              class="form-select shadow-none"
              placeholder="أدخل إسم المريض"
              class="form-control shadow-none"
            >
              <option value="" disabled selected>اختر النوع</option>
              <option value="Male">ذكر</option>
              <option value="Female">أنثى</option>
            </select>
            <div
              *ngIf="
                emergencyForm.get('gender')?.invalid &&
                emergencyForm.get('gender')?.touched
              "
              class="text-danger"
            >
              النوع مطلوب
            </div>
          </div>
        </div>
        <div class="col-lg-3 mb-3">
          <div class="mt-3">
            <label for="patientPhone" class="form-label"
              >رقم هاتف المريض<span class="text-danger">*</span></label
            >
            <input
              id="patientPhone"
              formControlName="patientPhone"
              placeholder="أدخل رقم هاتف المريض"
              class="form-control shadow-none"
            />
            <div
              *ngIf="
                emergencyForm.get('patientPhone')?.invalid &&
                emergencyForm.get('patientPhone')?.touched
              "
              class="text-danger"
            >
              <ng-container
                *ngIf="emergencyForm.get('patientPhone')?.errors?.['required']"
                >رقم الهاتف مطلوب</ng-container
              >
              <ng-container
                *ngIf="emergencyForm.get('patientPhone')?.errors?.['pattern']"
                >رقم الهاتف غير صحيح</ng-container
              >
            </div>
          </div>
        </div>
        <div class="col-lg-3 mb-3">
          <div class="mt-3">
            <label for="triageLevel" class="form-label"
              >درجة الخطورة<span class="text-danger">*</span></label
            >
            <select
              id="triageLevel"
              formControlName="emergencyLevel"
              class="form-select shadow-none triage-select"
            >
              <option value="" disabled selected>اختر درجة الخطورة</option>
              <option value="حرجة">حرجة</option>
              <option value="متوسطة">متوسطة</option>
              <option value="خفيفة">خفيفة</option>
            </select>
            <div
              *ngIf="
                emergencyForm.get('emergencyLevel')?.invalid &&
                emergencyForm.get('emergencyLevel')?.touched
              "
              class="text-danger"
            >
              درجة الخطورة مطلوبة
            </div>
          </div>
        </div>
      </div>
      <div class="row mt-3">
        <div class="col-lg-4 mb-3">
          <label for="companion-name" class="form-label"
            >إسم المرافق<span class="text-danger">*</span></label
          >
          <input
            id="companion-name"
            formControlName="companionName"
            placeholder="أدخل إسم المرافق"
            class="form-control shadow-none"
          />
          <div
            *ngIf="
              emergencyForm.get('companionName')?.invalid &&
              emergencyForm.get('companionName')?.touched
            "
            class="text-danger"
          >
            اسم المرافق مطلوب
          </div>
        </div>
        <div class="col-lg-4 mb-3">
          <label for="companion-id" class="form-label"
            >الرقم القومي للمرافق<span class="text-danger">*</span></label
          >
          <input
            id="companion-id"
            formControlName="companionNationalId"
            placeholder="أدخل الرقم القومي للمرافق"
            class="form-control shadow-none"
          />
          <div
            *ngIf="
              emergencyForm.get('companionNationalId')?.invalid &&
              emergencyForm.get('companionNationalId')?.touched
            "
            class="text-danger"
          >
            <ng-container
              *ngIf="emergencyForm.get('companionNationalId')?.errors?.['required']"
              >الرقم القومي للمرافق مطلوب</ng-container
            >
            <ng-container
              *ngIf="emergencyForm.get('companionNationalId')?.errors?.['pattern']"
              >الرقم القومي يجب أن يكون 14 رقمًا</ng-container
            >
          </div>
        </div>
        <div class="col-lg-4 mb-3">
          <label for="companion-phone" class="form-label"
            >رقم هاتف المرافق<span class="text-danger">*</span></label
          >
          <input
            id="companion-phone"
            formControlName="companionPhone"
            placeholder="أدخل رقم هاتف المرافق"
            class="form-control shadow-none"
          />
          <div
            *ngIf="
              emergencyForm.get('companionPhone')?.invalid &&
              emergencyForm.get('companionPhone')?.touched
            "
            class="text-danger"
          >
            <ng-container
              *ngIf="emergencyForm.get('companionPhone')?.errors?.['required']"
              >رقم الهاتف مطلوب</ng-container
            >
            <ng-container
              *ngIf="emergencyForm.get('companionPhone')?.errors?.['pattern']"
              >رقم الهاتف غير صحيح</ng-container
            >
          </div>
        </div>
      </div>
      <div class="mt-3">
        <label class="form-label">ملاحظات</label>
        <textarea
          formControlName="notes"
          rows="3"
          class="form-control shadow-none"
        ></textarea>
      </div>
      <hr />
      <div
        class="card-header border-bottom bg-gray d-flex align-items-center justify-content-between hh-50 px-3"
      >
        <h5 class="mb-0 fw-bold">
          <span>📋بيانات إضافية</span>
        </h5>
        <button type="button" class="btn-blue" (click)="additionalData()">
          {{ showAdditionalInfo ? "إخفاء" : "إظهار" }}
        </button>
      </div>
      <div class="row mb-3" *ngIf="showAdditionalInfo">
        <div class="col-lg-4">
          <label for="insuranceCompanyId" class="form-label"
            >شركة التأمين</label
          >
          <select
            id="insuranceCompanyId"
            class="form-select shadow-none"
            formControlName="insuranceCompanyId"
          >
            <option selected disabled value="">اختر شركة التأمين</option>
            <option
              *ngFor="let insuranceCompany of insuranceCompanies"
              [value]="insuranceCompany.id"
            >
              {{ insuranceCompany.name }}
            </option>
          </select>
        </div>
        <div class="col-lg-4">
          <label for="insuranceCategoryId" class="form-label"
            >فئة التأمين</label
          >
          <select
            id="insuranceCategoryId"
            class="form-select shadow-none"
            formControlName="insuranceCategoryId"
          >
            <option selected disabled value="">اختر فئة التأمين</option>
            <option
              *ngFor="let insuranceCategory of insuranceCompanies"
              [value]="insuranceCategory.id"
            >
              {{ insuranceCategory.name }}
            </option>
          </select>
          <div
            *ngIf="
              emergencyForm.get('insuranceCategoryId')?.invalid &&
              emergencyForm.get('insuranceCategoryId')?.touched
            "
            class="text-danger"
          >
            فئة التأمين مطلوبة
          </div>
        </div>
        <div class="col-lg-4">
          <label for="insuranceNumber" class="form-label">رقم التأمين</label>
          <input
            type="text"
            id="insuranceNumber"
            class="form-control shadow-none"
            formControlName="insuranceNumber"
            placeholder="أدخل رقم التأمين"
            pattern="[0-9]*"
          />
        </div>

        <div class="col-lg-4 mt-3">
          <label class="form-label">تم تحويله؟</label>
          <div class="form-check">
            <input
              type="radio"
              id="referredYes"
              class="form-check-input shadow-none"
              formControlName="referred"
              value="yes"
            />
            <label for="referredYes" class="form-check-label">نعم</label>
          </div>
          <div class="form-check">
            <input
              type="radio"
              id="referredNo"
              class="form-check-input shadow-none"
              formControlName="referred"
              value="no"
            />
            <label for="referredNo" class="form-check-label">لا</label>
          </div>
        </div>
        <div
          class="col-lg-4 mt-3"
          *ngIf="emergencyForm.get('referred')?.value === 'yes'"
        >
          <label for="referredClinic" class="form-label"
            >العيادة المحول منها</label
          >
          <select
            [disabled]="!emergencyForm.get('referred')?.value"
            id="referredClinic"
            class="form-select shadow-none"
            formControlName="referredClinic"
          >
            <option selected disabled value="">اختر العيادة</option>
            <option value="عيادة العظام">عيادة العظام</option>
            <option value="عيادة الباطنة">عيادة الباطنة</option>
          </select>
        </div>
        <!-- <div class="col-lg-4 mt-3">
          <label class="form-label">حاصل على تطعيم؟</label>
          <div class="form-check">
            <input type="radio" id="vaccinatedYes" class="form-check-input shadow-none" formControlName="vaccinated" value="yes">
            <label for="vaccinatedYes" class="form-check-label">نعم</label>
          </div>
          <div class="form-check">
            <input type="radio" id="vaccinatedNo" class="form-check-input shadow-none" formControlName="vaccinated" value="no">
            <label for="vaccinatedNo" class="form-check-label">لا</label>
          </div>
        </div> -->
        <div class="col-lg-4 mt-3">
          <label for="paymentMethod" class="form-label">وسيلة الدفع</label>
          <select
            id="paymentMethod"
            class="form-select shadow-none"
            formControlName="paymentMethod"
          >
            <option selected disabled value="">اختر وسيلة الدفع</option>
            <option value="نقدي">نقدي</option>
            <option value="تحويل لحظي">تحويل لحظي</option>
          </select>
        </div>
      </div>
      <div class="row justify-content-center gap-2">
        <button
          [disabled]="emergencyForm.invalid"
          class="btn-blue col-2"
          type="submit"
        >
          حفظ البيانات
        </button>
        <button type="reset" class="btn-outline-blue col-2">إلغاء</button>
      </div>
    </form>
  </div>
</main>
